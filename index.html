<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        console.error('GLOBAL ERROR:', message, error);
        fetch('/api/log-error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            type: 'error', 
            message: message ? message.toString() : 'Unknown', 
            source, 
            lineno, 
            colno, 
            stack: error ? error.stack : undefined 
          })
        }).catch(err => console.warn('Failed to log error to server', err));
      };
      window.addEventListener('unhandledrejection', function(event) {
        // Ignore benign Vite HMR errors
        const reasonStr = event.reason ? String(event.reason) : '';
        if (reasonStr.includes('WebSocket') || reasonStr.includes('vite')) {
          return;
        }

        console.error('UNHANDLED REJECTION:', event.reason);
        const reason = event.reason;
        let errorMessage = 'Unknown reason';
        let stack = undefined;

        if (reason instanceof Error) {
          errorMessage = reason.message;
          stack = reason.stack;
        } else if (typeof reason === 'string') {
          errorMessage = reason;
        } else {
          try {
            errorMessage = JSON.stringify(reason);
          } catch (e) {
            errorMessage = String(reason);
          }
        }

        fetch('/api/log-error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            type: 'unhandledrejection', 
            reason: errorMessage,
            stack: stack
          })
        }).catch(err => console.warn('Failed to log rejection to server', err));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
