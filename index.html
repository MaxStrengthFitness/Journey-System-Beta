<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page run under the iPad status bar and the
         home indicator, and is what makes env(safe-area-inset-*) report real
         values. Without it every inset in the app is 0. The app pads for the
         insets itself: src/features/home-screen/README.md. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iPad Safari otherwise guesses that "54 LB 7 REPS" on a routine row is
         an address or a phone number and underlines it. Nothing in this app
         is a link unless it is drawn as one. -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <title>Max Strength App</title>

    <!-- The Home Screen web app (Safari: Share -> Add to Home Screen).
         src/features/home-screen/README.md explains every line of this. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Journey" />
    <!-- iPadOS draws its own status bar ABOVE the page and colours it with
         theme-color (below): the frame's navy, in both themes. It was black-translucent (the page running up under the
         clock) until Sep 27 2026, when AJ's iPad showed the iPadOS 26 bug in
         that style: the app is laid out a status bar taller than it is shown,
         so the bottom bar's labels ran into a black strip at the foot of the
         screen. iOS reads this tag when the icon is added: after changing it,
         delete the Home Screen icon and add it again. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The frame (--chrome): the header and the bottom bar, the logo's navy
         in both themes since the Navy Frame (Oct 4 2026), which is also the
         Home Screen app's status bar. ThemeProvider copies the token in on
         every theme change; the script below sets it before the first paint.
         After changing it, delete the Home Screen icon and add it again. -->
    <meta name="theme-color" content="#002341" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- Warm the connections every open needs before the app's script has
         even downloaded (the speed round, Oct 5 2026, R5): Firestore, and
         Firebase Auth's two (who is signed in, a fresh token each morning).
         crossorigin because the SDKs call them with CORS and no cookies, and
         a preconnect only helps a request of the same kind. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <script>
      // The sign-in popup's helper loads from two more places, and only where
      // the sign-in screen is likely next: nobody was signed in here last
      // time (src/lib/auth-boot.ts, the same key; a signed-in open never
      // loads the helper since R14). The auth domain is the production
      // project's, public by design; another project's build just warms a
      // connection it won't use.
      (function () {
        var signedIn = false;
        try {
          signedIn = localStorage.getItem("journey_signed_in_here") === "1";
        } catch (e) {}
        if (signedIn) return;
        ["https://apis.google.com", "https://gen-lang-client-0731527386.firebaseapp.com"].forEach(function (href) {
          var link = document.createElement("link");
          link.rel = "preconnect";
          link.href = href;
          document.head.appendChild(link);
        });
      })();
    </script>
    <script>
      // The theme before the first paint. ThemeProvider (src/components/
      // ThemeProvider.tsx) owns the theme once React runs; until then <html>
      // has no .dark class, so a Home Screen launch painted the LIGHT ground
      // for a moment even though the app defaults to dark, and iPadOS
      // coloured the status bar from a theme-color that did not match.
      // Same key, same default ("dark", from main.tsx) and same "system" rule
      // as ThemeProvider. The status bar is the frame's navy (--chrome)
      // whatever the theme; the theme only decides the .dark class.
      (function () {
        var theme = "dark";
        try {
          theme = localStorage.getItem("journey-system-theme") || "dark";
        } catch (e) {}
        if (theme === "system") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (theme !== "light") theme = "dark";
        document.documentElement.classList.add(theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", "#002341");
      })();
    </script>
    <script>
      // Buffer only. Errors that happen before the app bundle finishes loading
      // (a chunk that failed to download, a syntax error in the entry) would
      // otherwise go unreported, because the real handlers live in
      // src/main.tsx. This queue is drained there.
      //
      // It used to POST to /api/log-error directly, which meant every error
      // after load was reported twice: once here, once from main.tsx. The
      // __appLoaded flag makes these handlers stand down as soon as main.tsx
      // takes over, so there is exactly one reporter at any moment.
      window.__earlyErrors = [];
      window.addEventListener('error', function (e) {
        if (window.__appLoaded) return;
        window.__earlyErrors.push({
          type: 'early_error',
          message: e.message,
          stack: e.error && e.error.stack,
        });
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (window.__appLoaded) return;
        window.__earlyErrors.push({
          type: 'early_unhandledrejection',
          message: String((e.reason && e.reason.message) || e.reason),
        });
      });
    </script>
    <style>
      /* THE FIRST FRAME (the speed round, Oct 5 2026, R15). Until the app's
         script has downloaded and run, #root held nothing and the iPad showed
         a blank page. This is the front door's opening (OpeningJourney in
         src/features/front-door/CheckingIn.tsx): the logo's three squares on
         its dark ground, in the same place, drawn by the browser alone. React
         replaces it when it mounts, and OpeningJourney then shows the squares
         still rather than dropping them in a second time. Plain CSS and an
         inline SVG, no file to fetch. The colours are front-door.css's, named
         once more here because this paints before any stylesheet of the
         app's has been read. Safe areas: the page runs edge to edge
         (viewport-fit=cover), so the top inset is paid as the pane does. */
      #first-frame {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top, 0px) + 40px) 24px calc(env(safe-area-inset-bottom, 0px) + 32px);
        background: radial-gradient(120% 70% at 50% 0%, #0d2740 0%, #071422 45%, #040a12 100%) fixed, #040a12;
      }
      #first-frame .ff-tiles { display: flex; gap: 10px; }
      #first-frame .ff-sq { width: 84px; height: 84px; border-radius: 6px; display: grid; place-items: center; }
      #first-frame .ff-sq svg { width: 62%; height: 62%; }
      #first-frame .ff-m { background: #0a548b; }
      #first-frame .ff-a { background: #f36d21; }
      #first-frame .ff-x { background: #5b6770; }
      #first-frame p { margin: 28px 0 0; font: 14px/1.45 system-ui, -apple-system, sans-serif; color: #8a9aab; }
      /* OpeningJourney keeps an empty line for its slow note; so does this, so nothing moves. */
      #first-frame p.ff-slow { margin-top: 18px; }
      /* The slow line, six seconds after the first paint, with no script: a
         slow download of the app's script is the wait it is for (the speed
         round's final review). CheckingIn.tsx's SLOW_LINE, word for word. */
      #first-frame p.ff-slow::after {
        content: "Taking longer than usual. The Wi-Fi may be slow; Journey keeps trying.";
        visibility: hidden;
        animation: ff-show 0s linear 6s forwards;
      }
      @keyframes ff-show { to { visibility: visible; } }
      @media (max-width: 599px) {
        #first-frame { padding: calc(env(safe-area-inset-top, 0px) + 28px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px); }
        #first-frame .ff-sq { width: 68px; height: 68px; }
      }
    </style>
  </head>
  <body>
    <!-- The strip under the iPad status bar, on every screen including the
         sign-in, the crash page and every sheet. Its height is the status
         bar's inset, so it is 0px in a Safari tab, and in the Home Screen app
         too while the status bar style above is "default". It is kept so the
         style can go back to black-translucent in one line. index.css, "Safe
         areas". -->
    <div class="status-band" aria-hidden="true"></div>
    <div id="root"><div id="first-frame" aria-busy="true" aria-label="Opening Journey"><div class="ff-tiles" role="img" aria-label="Max Strength Fitness"><div class="ff-sq ff-m"><svg viewBox="0 0 425 425" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M140 284V139l72.5 145L285 139v145" /></svg></div><div class="ff-sq ff-a"><svg viewBox="0 0 425 425" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M140 284l72.5-145L285 284" /></svg></div><div class="ff-sq ff-x"><svg viewBox="0 0 425 425" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M140 139l145 145m0-145l-145 145" /></svg></div></div><p>Opening Journey…</p><p class="ff-slow"></p></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
